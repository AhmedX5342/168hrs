# Place this file at: .github/workflows/android-build.yml
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Do NOT install the obsolete "tools" package (removed from current cmdline-tools).
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;34.0.0 build-tools;35.0.0 platforms;android-34 platforms;android-35

      - name: Install JS dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found under android/app/build/outputs/apk"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"
          cp "$APK" "168hrs-${{ github.sha }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 168hrs-apk
          path: 168hrs-${{ github.sha }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.sha }}
          name: APK build #${{ github.run_number }}
          body: |
            Automatic Android debug APK from `${{ github.ref_name }}` (`${{ github.sha }}`).
            Installable for testing (debug-signed).
          files: 168hrs-${{ github.sha }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
